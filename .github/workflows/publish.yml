name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Do not set registry-url here — it injects a dummy NODE_AUTH_TOKEN
          # that blocks OIDC trusted publishing.

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        # No NODE_AUTH_TOKEN — npm uses GitHub OIDC via trusted publishing.
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public
