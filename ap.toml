version = 1

[bundle.npm]
ask = "NPM token for publish."
docs = "https://docs.npmjs.com/creating-and-viewing-access-tokens"
prompt = "Use NPM_TOKEN. Prefer NODE_AUTH_TOKEN=$NPM_TOKEN for npm publish."
vars = ["NPM_TOKEN"]

[bundle.cloudflare]
ask = "Cloudflare credentials for Workers deploy."
docs = "https://developers.cloudflare.com/fundamentals/api/get-started/"
prompt = "Prefer CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for wrangler. Global key also available as CF_GLOBAL_*."
vars = ["CF_GLOBAL_API_KEY", "CF_GLOBAL_EMAIL", "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
